name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  check-latest: true
            - run: npm ci
            - run: npm run lint
            - run: npm test

    e2e:
        # Converts the fixture apps for real: installs React Router / Vite, type-checks, builds and serves them,
        # with npm, pnpm, Yarn and Bun.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  check-latest: true
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: oven-sh/setup-bun@v2
            - run: corepack enable
            - run: npm ci
            - run: npm run test:e2e
